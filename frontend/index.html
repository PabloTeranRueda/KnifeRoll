<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet"
    >
</head>
<body>
    <h1>Escandallo</h1>

    <form>
        <div class="mb-3">
            <label for="mainProductName" class="form-label">Producto</label>
            <input class="form-control" id="mainProductName" aria-describedby="mainProductNameHelp">
            <div id="mainProductNameHelp" class="form-text">¿Qué vamos a despiezar hoy?</div>
        </div>

        <label for="mainProductWeight" class="form-label">Peso/Cantidad</label>
        <div class="input-group mb-3">
            <input
                type="number"
                class="form-control"
                id="mainProductWeight"
                min="0"
                step="0.1"
                placeholder="0.0"
            >
            <div class="input-group-append dropend">
                <button
                    type="button"
                    class="btn btn-secondary dropdown-toggle"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                >
                    g
                </button>

                <div class="dropdown-menu">
                    <a class="dropdown-item" href="#">g</a>
                    <a class="dropdown-item" href="#">kg</a>
                    <a class="dropdown-item" href="#">l</a>
                </div>
            </div>
        </div>

        <label for="mainProductYield" class="form-label">Merma</label>
        <div class="input-group mb-3">
            <input
                type="number"
                class="form-control"
                id="mainProductYield"
                min="0"
                step="0.1"
                placeholder="0.0"
            >
            <div class="input-group-append dropend">
                <button
                    type="button"
                    class="btn btn-secondary dropdown-toggle"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                >
                    g
                </button>

                <div class="dropdown-menu">
                    <a class="dropdown-item" href="#">g</a>
                    <a class="dropdown-item" href="#">kg</a>
                    <a class="dropdown-item" href="#">l</a>
                </div>
            </div>
        </div>


        <div class="input-group-append">
            <button
                type="button"
                class="btn btn-primary"
                data-bs-toggle="dropdown"
                aria-expanded="false"
            >
                + Subproducto
            </button>
        
        <button type="submit" class="btn btn-primary">Enviar Productos a Economato</button>
    </form>
    <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
